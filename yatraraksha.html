    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    
    body {

      color: #e2e8f0;
      overflow-x: hidden;
    }

    .font-serif-gold {
      font-family: 'Cinzel', serif;
    }

    /* Glassmorphism */
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(217, 119, 6, 0.2);
    }

    .glass-card-gold {
      background: linear-gradient(135deg, rgba(30, 27, 75, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 8px 32px 0 rgba(217, 119, 6, 0.15);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-gradient-bg {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .gold-border {
      border-color: rgba(245, 158, 11, 0.3);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }

    #map-container {
      height: 100%;
      width: 100%;
      border-radius: 0.75rem;
      z-index: 1;
    }

    .pulse-danger {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-danger-anim 1.5s infinite;
    }

    @keyframes pulse-danger-anim {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
  </style>
</head>

    // --- TRANSLATION MESSAGES ---

        blockchainLedger: "பிளாக்செயின் பிணையம்",
      },
      hi: {
        appTitle: "यात्रा रक्षा",
        subtitle: "स्मार्ट पर्यटक सुरक्षा और आपातकालीन प्रतिक्रिया प्रणाली",
        modeTourist: "पर्यटक ऐप",

        emergencyNumbers: "आपातकालीन नंबर: 112",
        activeIncidents: "सक्रिय घटनाएं",
        touristCount: "ट्रैक किए गए पर्यटक",
        blockchainLedger: "ब्लॉकचेन नेटवर्क",
      },
      ml: {
        appTitle: "യാത്രാരക്ഷ",
        subtitle: "സ്മാർട്ട് ടൂറിസ്റ്റ് സുരക്ഷാ സംവിധാനം",
        modeTourist: "ടൂറിസ്റ്റ് ആപ്പ്",
        modeAuthority: "കമാൻഡ് സെന്റർ",
        modeSim: "ജിപിഎസ് സിമുലേറ്റർ",
        modeVerify: "ക്യുആർ പരിശോധന",
        sosHold: "അടിയന്തര സഹായത്തിന് (2 സെക്കൻഡ്)",
        sosCancelling: "റദ്ദാക്കുക",
        safetyScore: "സുരക്ഷാ സ്കോർ",
        zoneStatus: "നിലവിലെ പ്രദേശം",
        safe: "സുരക്ഷിത പ്രദേശം",
        caution: "ജാഗ്രതാ പ്രദേശം",
        highRisk: "ഉയർന്ന അപകടസാധ്യത",
        restricted: "നിരോധിത മേഖല",
        digitalId: "ബ്ലോക്ക്ചെയിൻ ഡിജിറ്റൽ ഐഡി",
        verified: "സ്ഥിരീകരിച്ചു",
        askRaksha: "രക്ഷ AI അസിസ്റ്റന്റിനോട് ചോദിക്കുക...",
        emergencyNumbers: "അടിയന്തര നമ്പർ: 112",
        activeIncidents: "സജീവ സംഭവങ്ങൾ",
        touristCount: "ടൂറിസ്റ്റുകൾ",
        blockchainLedger: "ബ്ലോക്ക്ചെയിൻ ശൃംഖല",
      }
    };

    // --- DEMO GEO-ZONES (Ooty/Nilgiris Region Demo Coordinates) ---
    const MOCK_ZONES = [
      { id: 'z1', name: 'Ooty Botanical Gardens', type: 'SAFE', lat: 11.416, lng: 76.712, radius: 800, desc: 'Well lit, high security, tourist area' },
      { id: 'z2', name: 'Doddabetta Viewpoint', type: 'CAUTION', lat: 11.402, lng: 76.736, radius: 900, desc: 'Fog advisory & steep cliffs' },
      { id: 'z3', name: 'Pykara Forest Reserve Pass', type: 'HIGH_RISK', lat: 11.432, lng: 76.602, radius: 1200, desc: 'Wildlife movement area after dusk' },
      { id: 'z4', name: 'Avalanche Landslide Hazard Zone', type: 'RESTRICTED', lat: 11.315, lng: 76.580, radius: 1500, desc: 'Active landslide alert & restricted access' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [lang, setLang] = useState('en');
      const t = i18n[lang];

      // View state: 'tourist' | 'authority' | 'sim' | 'verify'
      const [activeView, setActiveView] = useState('tourist');

      // Shared Tourist State
      const [tourist, setTourist] = useState({
        name: "Aarav Sharma",
        passport: "IND-8849201",
        nationality: "Indian",
        digitalIdHash: "0x7f8a91c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b",
        blockchainTx: "0x3a4b...91f2",
        status: "VALID",
        expiry: "2026-10-15",
        battery: 88,
        lat: 11.4165,
        lng: 76.7125,
        speed: 3.2, // km/h
        currentZone: MOCK_ZONES[0],
        privacySharing: true,
      });

      // Safety Score Engine
      const [safetyScore, setSafetyScore] = useState(95);
      const [scoreDeductions, setScoreDeductions] = useState([]);
      const [scoreHistory, setScoreHistory] = useState([
        { time: '10:00', score: 100, reason: 'Trip Started' },
        { time: '10:30', score: 98, reason: 'Normal movement' },
        { time: '11:00', score: 95, reason: 'Entered Safe Zone' }
      ]);

      // Incidents & Alerts Queue
      const [incidents, setIncidents] = useState([
        {
          id: 'INC-1092',
          touristName: 'Elena Rostova',
          touristId: '0x99a1...1092',
          type: 'SOS_MANUAL',
          status: 'NEW',
          lat: 11.3160,
          lng: 76.5810,
          timestamp: new Date().toLocaleTimeString(),
          zone: 'Avalanche Landslide Hazard Zone',
          battery: 14,
          score: 32
        }
      ]);

      // SOS Trigger States
      const [sosHolding, setSosHolding] = useState(false);
      const [sosCountdown, setSosCountdown] = useState(null);
      const [activeSos, setActiveSos] = useState(null);
      const holdTimerRef = useRef(null);

      // Audit Trail Ledger
      const [auditTrail, setAuditTrail] = useState([
        { id: 1, action: "DIGITAL_ID_ISSUED", actor: "System Issuer", target: "0x7f8a91c...", hash: "0x12ab...99", time: "09:15 AM" },
        { id: 2, action: "GEOZONE_ENTER", actor: "Tourist (Aarav)", target: "Ooty Botanical Gardens", hash: "0x88cd...31", time: "10:00 AM" }
      ]);

      // Calculate Safety Score dynamically
      const recalculateScore = (currentTourist) => {
        let score = 100;
        let reasons = [];

        // Zone Penalty
        if (currentTourist.currentZone?.type === 'CAUTION') {
          score -= 10;
          reasons.push('Caution Zone (-10)');
        } else if (currentTourist.currentZone?.type === 'HIGH_RISK') {
          score -= 25;
          reasons.push('High-Risk Area (-25)');
        } else if (currentTourist.currentZone?.type === 'RESTRICTED') {
          score -= 40;
          reasons.push('Restricted Area (-40)');
        }

        // Battery penalty
        if (currentTourist.battery < 20) {
          score -= 15;
          reasons.push('Low Battery (-15)');
        }

        // Night time check simulation
        const currentHour = new Date().getHours();
        if (currentHour >= 21 || currentHour <= 5) {
          if (currentTourist.currentZone?.type !== 'SAFE') {
            score -= 10;
            reasons.push('Night Wandering Hazard (-10)');
          }
        }

        score = Math.max(0, Math.min(100, score));
        setSafetyScore(score);
        setScoreDeductions(reasons);
      };

      // Trigger recalculation on tourist telemetry update
      useEffect(() => {
        recalculateScore(tourist);
      }, [tourist.lat, tourist.lng, tourist.battery, tourist.currentZone]);

      // SOS Hold Logic
      const handleSosMouseDown = () => {
        setSosHolding(true);
        holdTimerRef.current = setTimeout(() => {
          startSosCountdown();
        }, 2000);
      };

      const handleSosMouseUp = () => {
        setSosHolding(false);
        if (holdTimerRef.current && sosCountdown === null) {
          clearTimeout(holdTimerRef.current);
        }
      };

      const startSosCountdown = () => {
        setSosCountdown(5);
      };

      useEffect(() => {
        let interval = null;
        if (sosCountdown !== null && sosCountdown > 0) {
          interval = setInterval(() => {
            setSosCountdown(prev => prev - 1);
          }, 1000);
        } else if (sosCountdown === 0) {
          triggerFinalSos();
          setSosCountdown(null);
        }
        return () => clearInterval(interval);
      }, [sosCountdown]);

      const triggerFinalSos = () => {
        const newSos = {
          id: `INC-${Math.floor(1000 + Math.random() * 9000)}`,
          touristName: tourist.name,
          touristId: tourist.digitalIdHash.substring(0, 10) + '...',
          type: 'SOS_TRIGGERED',
          status: 'NEW',
          lat: tourist.lat,
          lng: tourist.lng,
          timestamp: new Date().toLocaleTimeString(),
          zone: tourist.currentZone?.name || 'Unknown',
          battery: tourist.battery,
          score: safetyScore
        };

        setActiveSos(newSos);
        setIncidents(prev => [newSos, ...prev]);

        // Log to Blockchain Audit
        const auditEntry = {
          id: Date.now(),
          action: "EMERGENCY_SOS_EMITTED",
          actor: tourist.name,
          target: newSos.id,
          hash: `0x${Math.random().toString(16).substring(2, 10)}...`,
          time: new Date().toLocaleTimeString()
        };
        setAuditTrail(prev => [auditEntry, ...prev]);
      };

      const cancelSos = () => {
        setSosCountdown(null);
        setSosHolding(false);
        if (holdTimerRef.current) clearTimeout(holdTimerRef.current);
      };

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {/* TOP NAVBAR */}
          <header className="bg-slate-900/90 border-b border-amber-500/20 sticky top-0 z-50 backdrop-blur-md px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl gold-gradient-bg flex items-center justify-center font-bold text-slate-950 text-xl font-serif-gold shadow-lg shadow-amber-500/20">
                YR
              </div>
              <div>
                <h1 className="font-serif-gold text-lg md:text-xl font-bold tracking-wider gold-gradient-text">
                  {t.appTitle}
                </h1>
                <p className="text-xs text-slate-400 hidden sm:block">{t.subtitle}</p>
              </div>
            </div>

            {/* NAVIGATION TABS */}
            <nav className="flex items-center space-x-1 sm:space-x-2 bg-slate-950/80 p-1 rounded-xl border border-slate-800">
              <button
                onClick={() => setActiveView('tourist')}
                className={`px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all ${
                  activeView === 'tourist' ? 'gold-gradient-bg text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                📱 {t.modeTourist}
              </button>
              <button
                onClick={() => setActiveView('authority')}
                className={`px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all ${
                  activeView === 'authority' ? 'gold-gradient-bg text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                🛡️ {t.modeAuthority}
              </button>
              <button
                onClick={() => setActiveView('sim')}
                className={`px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all ${
                  activeView === 'sim' ? 'gold-gradient-bg text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                ⚡ {t.modeSim}
              </button>
              <button
                onClick={() => setActiveView('verify')}
                className={`px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all ${
                  activeView === 'verify' ? 'gold-gradient-bg text-slate-950 shadow-md' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                🔍 {t.modeVerify}
              </button>
            </nav>

            {/* LANGUAGE SELECTOR & STATUS */}
            <div className="flex items-center space-x-3">
              <div className="hidden lg:flex items-center space-x-2 bg-slate-950 px-2.5 py-1 rounded-lg border border-amber-500/20 text-xs text-amber-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Hardhat #31337</span>
              </div>

              <select
                value={lang}
                onChange={(e) => setLang(e.target.value)}
                className="bg-slate-950 border border-slate-700 text-slate-200 text-xs md:text-sm rounded-lg px-2.5 py-1.5 focus:border-amber-500 focus:outline-none"
              >
                <option value="en">English (IN)</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="ml">മലയാളം (Malayalam)</option>
              </select>
            </div>
          </header>

          {/* MAIN VIEW CONTENT CONTAINER */}
          <main className="flex-1 p-4 max-w-7xl w-full mx-auto">
            {/* VIEW 1: TOURIST PWA MODE */}
            {activeView === 'tourist' && (
              <TouristPwaView
                tourist={tourist}
                setTourist={setTourist}
                safetyScore={safetyScore}
                scoreDeductions={scoreDeductions}
                sosHolding={sosHolding}
                sosCountdown={sosCountdown}
                activeSos={activeSos}
                handleSosMouseDown={handleSosMouseDown}
                handleSosMouseUp={handleSosMouseUp}
                cancelSos={cancelSos}
                t={t}
              />
            )}

            {/* VIEW 2: AUTHORITY COMMAND CENTER */}
            {activeView === 'authority' && (
              <AuthorityCommandCenter
                tourist={tourist}
                incidents={incidents}
                setIncidents={setIncidents}
                zones={MOCK_ZONES}
                auditTrail={auditTrail}
                t={t}
              />
            )}

            {/* VIEW 3: GPS TELEMETRY SIMULATOR */}
            {activeView === 'sim' && (
              <GpsSimulatorView
                tourist={tourist}
                setTourist={setTourist}
                zones={MOCK_ZONES}
                t={t}
              />
            )}

            {/* VIEW 4: PUBLIC QR VERIFICATION */}
            {activeView === 'verify' && (
              <PublicQrVerifierView
                tourist={tourist}
                zones={MOCK_ZONES}
                t={t}
              />
            )}
          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-800/80 bg-slate-950/80 px-4 py-3 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
              <p>© 2026 YatraRaksha — Smart Tourist Safety Platform. Privacy-by-design enabled.</p>
              <div className="flex space-x-4">
                <span className="text-slate-400">AES-256 PII Encryption</span>
                <span>•</span>
                <span className="text-slate-400">Polygon Amoy Testnet</span>
                <span>•</span>
                <span className="text-slate-400">Offline PWA IndexedDB Queue</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // --- SUB-COMPONENT: TOURIST PWA VIEW ---
    function TouristPwaView({ tourist, setTourist, safetyScore, scoreDeductions, sosHolding, sosCountdown, activeSos, handleSosMouseDown, handleSosMouseUp, cancelSos, t }) {
      const [chatMessages, setChatMessages] = useState([
        { sender: 'bot', text: 'Namaste! I am Raksha, your AI Safety Companion. How can I assist you today?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const sendChat = () => {
        if (!chatInput.trim()) return;
        const newMsgs = [...chatMessages, { sender: 'user', text: chatInput }];
        setChatMessages(newMsgs);
        setChatInput('');

        // Simple intelligent bot response logic
        setTimeout(() => {
          let botReply = "I am monitoring your location safely. The surrounding area has regular police patrols.";

            }`}>
              <div className="flex justify-between items-center">
                <span className="font-bold text-sm text-slate-200">
                  {verificationResult.valid ? '✓ VERIFIED TOURIST DIGITAL ID' : '❌ VERIFICATION FAILED'}
                </span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                  verificationResult.valid ? 'bg-emerald-500 text-slate-950' : 'bg-rose-600 text-white'
                }`}>
                  {verificationResult.valid ? verificationResult.status : 'INVALID'}
                </span>
              </div>

              {verificationResult.valid && (
                <div className="space-y-1 text-slate-300 pt-2 border-t border-emerald-500/20">
                  <p>Tourist: <span className="font-bold text-white">{verificationResult.touristName}</span></p>
                  <p>Document: <span className="font-mono text-slate-200">{verificationResult.passport}</span></p>
                  <p>Issuer: <span className="text-amber-400">{verificationResult.issuedBy}</span></p>
                  <p>Tx Hash: <span className="font-mono text-slate-400 text-[10px]">{verificationResult.txHash}</span></p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Render the React app into root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
